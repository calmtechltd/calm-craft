name: Installed package smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact public @calmcraft/cli version to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - run: node -e 'if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(process.env.CALMCRAFT_SMOKE_VERSION)) process.exit(1)'
        env:
          CALMCRAFT_SMOKE_VERSION: ${{ inputs.version }}

  smoke:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - name: Verify installed package
        shell: bash
        run: |
          export CALMCRAFT_SMOKE_NPM_CLI="$(npm root --global)/npm/bin/npm-cli.js"
          node scripts/installed-package-smoke.mjs --expect-provenance
        env:
          CALMCRAFT_SMOKE_VERSION: ${{ inputs.version }}
